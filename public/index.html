<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BikeShare SaaS - Sistema de Gestión de Alquiler de Bicicletas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Pantalla de Login -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <i class="fas fa-bicycle"></i>
      </div>
      <h1>BikeShare SaaS</h1>
      <p class="login-subtitle">Sistema de gestión de alquiler de bicicletas</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="usuario" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      </form>
      <p class="login-hint">Demo: usuario <strong>admin</strong> / contraseña <strong>admin123</strong></p>
      <div id="loginError" class="alert alert-error hidden"></div>
    </div>
  </div>

  <!-- Panel Principal -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-bicycle"></i> BikeShare
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="#" class="nav-item" data-page="bikes"><i class="fas fa-bicycle"></i> Bicicletas</a>
        <a href="#" class="nav-item" data-page="stations"><i class="fas fa-map-marker-alt"></i> Estaciones</a>
        <a href="#" class="nav-item" data-page="bookings"><i class="fas fa-calendar-check"></i> Reservas</a>
        <a href="#" class="nav-item" data-page="customers"><i class="fas fa-users"></i> Clientes</a>
        <a href="#" class="nav-item" data-page="pricing"><i class="fas fa-tags"></i> Tarifas</a>
        <a href="#" class="nav-item" data-page="bikeStatuses"><i class="fas fa-list-check"></i> Estados</a>
        <a href="#" class="nav-item" data-page="reports"><i class="fas fa-chart-bar"></i> Reportes</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main">
      <header class="main-header">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="user-info">
          <span id="userName"></span>
          <span id="userRole" class="badge"></span>
        </div>
      </header>

      <div id="pageContent" class="page-content">
        <!-- Contenido dinámico se renderiza aquí -->
      </div>
    </main>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
